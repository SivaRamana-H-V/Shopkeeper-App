name: pulse_ledger
description: "Pulse — A chat-first ledger app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.1.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^6.2.1

  # UI & Fonts
  google_fonts: ^8.0.2

  # Utilities
  intl: ^0.20.2
  logger: ^2.4.0
  shared_preferences: ^2.3.2
  flutter_contacts: ^1.1.9
  math_expressions: ^3.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
